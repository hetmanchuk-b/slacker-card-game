name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [24, 26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check

  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node: [24, 26]
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: penky_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: penky-ci-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d penky_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PENKY_TEST_DATABASE_URL: postgresql://postgres:penky-ci-test@127.0.0.1:5432/penky_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:postgres
      - run: npm audit --omit=dev
